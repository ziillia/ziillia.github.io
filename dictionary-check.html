<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#10182c">
  <title>辞書読込チェック v1.5.4</title>
  <style>
    :root{color-scheme:dark;font-family:system-ui,-apple-system,sans-serif;background:#10182c;color:#eef3fb}*{box-sizing:border-box}body{margin:0;padding:24px 16px 60px}.wrap{max-width:820px;margin:auto}h1{font-size:24px;margin:0 0 6px}.lead{color:#9dacbf;line-height:1.6;margin:0 0 18px}.status{padding:16px;border:1px solid #34445f;background:#17243a;margin:14px 0}.status b{display:block;font-size:22px}.status span{color:#9dacbf}.ok{border-color:#36c78b}.ng{border-color:#ff775e}.warn{border-color:#e3be43}button,a{display:inline-block;border:0;background:#ff7438;color:white;padding:12px 16px;font-weight:800;text-decoration:none;margin:0 8px 8px 0}.secondary{background:#30415d}dl{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}dl div{background:#17243a;padding:10px;min-width:0}dt{font-size:10px;color:#8fa0b8}dd{margin:4px 0 0;overflow-wrap:anywhere;white-space:pre-wrap}pre{background:#080f1e;padding:12px;overflow:auto;white-space:pre-wrap}@media(max-width:600px){dl{grid-template-columns:1fr}}
  </style>
</head>
<body><main class="wrap">
  <h1>MusicBrainz辞書 読込チェック</h1>
  <p class="lead">v1.5.4。通信、本文、JSON解析を別々に確認します。解析中にSafariがページを終了した場合も、次回起動時に直前の段階を表示します。</p>
  <div id="status" class="status warn"><b>待機中</b><span>自動診断を開始します。</span></div>
  <button id="run" type="button">もう一度診断</button><button id="download" class="secondary" type="button" disabled>結果を保存</button><a class="secondary" href="drive-dj-finder.html">アプリへ戻る</a>
  <h2>今回の結果</h2><dl id="details"></dl>
  <h2>前回の停止地点</h2><pre id="previous">なし</pre>
</main>
<script>
const VERSION='1.5.4-dictionary-diagnostics',CHECKPOINT_KEY='driveDjDictionaryStandaloneCheckpoint';let report=null;
const $=id=>document.getElementById(id),sleep=ms=>new Promise(resolve=>setTimeout(resolve,ms));
function render(){
  const details=$('details');details.innerHTML=Object.entries(report||{}).map(([key,value])=>`<div><dt>${escapeHtml(key)}</dt><dd>${escapeHtml(typeof value==='object'?JSON.stringify(value):value)}</dd></div>`).join('');
}
function escapeHtml(value){return String(value??'').replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));}
function setStatus(title,body,kind='warn'){$('status').className=`status ${kind}`;$('status').innerHTML=`<b>${escapeHtml(title)}</b><span>${escapeHtml(body)}</span>`;}
function checkpoint(){localStorage.setItem(CHECKPOINT_KEY,JSON.stringify(report));render();}
async function run(){
  $('run').disabled=true;$('download').disabled=true;const started=performance.now();
  report={version:VERSION,createdAt:new Date().toISOString(),stage:'fetch',url:new URL(`musicbrainz-ocr-dictionary.js?v=${encodeURIComponent(VERSION)}-${Date.now()}`,location.href).href,userAgent:navigator.userAgent,online:navigator.onLine,serviceWorkerControlled:Boolean(navigator.serviceWorker?.controller),httpStatus:0,responseSource:'',contentType:'',contentLength:0,textCharacters:0,prefix:'',suffix:'',fetchMs:0,parseMs:0,totalMs:0,count:0,error:''};
  checkpoint();setStatus('1/3 通信中','辞書ファイルのHTTP応答を確認しています。');
  const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),90000);
  try{
    const response=await fetch(report.url,{cache:'no-store',signal:controller.signal});report.fetchMs=Math.round(performance.now()-started);report.httpStatus=response.status;report.finalUrl=response.url;report.responseSource=response.headers.get('x-drive-dj-source')||'(判別不可)';report.contentType=response.headers.get('content-type')||'';report.contentLength=Number(response.headers.get('content-length'))||0;
    if(!response.ok)throw new Error(`HTTP ${response.status}`);
    report.stage='body';checkpoint();setStatus('2/3 本文確認中','先頭・末尾・辞書マーカーを確認しています。');
    const text=await response.text();report.textCharacters=text.length;report.prefix=text.slice(0,120).replace(/\s+/g,' ');report.suffix=text.slice(-60).replace(/\s+/g,' ');
    const marker='window.MUSICBRAINZ_OCR_DICTIONARY=',markerAt=text.indexOf(marker),arrayStart=markerAt<0?-1:text.indexOf('[',markerAt+marker.length),arrayEnd=text.lastIndexOf('];');
    if(markerAt<0)throw new Error('辞書マーカーがありません。HTMLや空ファイルが返った可能性があります。');if(arrayStart<0||arrayEnd<=arrayStart)throw new Error('JSON配列の開始・終了がありません。ファイルが途中で切れた可能性があります。');
    report.stage='parse';checkpoint();setStatus('3/3 JSON解析中','ここで画面が閉じる場合はSafariのメモリ・実行問題です。');await sleep(80);
    const parseStarted=performance.now(),rows=JSON.parse(text.slice(arrayStart,arrayEnd+1));report.parseMs=Math.round(performance.now()-parseStarted);
    if(!Array.isArray(rows)||rows.length<1000)throw new Error(`辞書件数が不正です: ${Array.isArray(rows)?rows.length:'配列ではありません'}`);
    report.count=rows.length;report.first=rows[0];report.last=rows[rows.length-1];report.stage='ready';report.totalMs=Math.round(performance.now()-started);checkpoint();setStatus('正常に読み込めました',`${rows.length.toLocaleString()}件。配信とJSON解析は正常です。`,'ok');
  }catch(error){report.failedStage=report.stage;report.stage='error';report.error=error?.name==='AbortError'?'90秒でタイムアウトしました。':String(error?.message||error);report.totalMs=Math.round(performance.now()-started);checkpoint();setStatus(`失敗: ${report.failedStage}`,report.error,'ng');}
  finally{clearTimeout(timer);$('run').disabled=false;$('download').disabled=false;render();}
}
$('run').addEventListener('click',run);$('download').addEventListener('click',()=>{const blob=new Blob([JSON.stringify(report,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`drive-dj-dictionary-check-${Date.now()}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);});
try{$('previous').textContent=localStorage.getItem(CHECKPOINT_KEY)||'なし';}catch(error){$('previous').textContent=`読込不可: ${error.message}`;}setTimeout(run,0);
</script></body></html>
