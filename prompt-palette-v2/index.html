<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#10141c">
<meta name="description" content="人物写真のためのモジュール式プロンプト。仕上がり、撮影、身体と衣装を独立して組み立てます。">
<title>Prompt Palette</title>
<link rel="stylesheet" href="./style.css?v=19">
<script defer src="./catalog.js?v=19"></script><script defer src="./engine.js?v=19"></script><script defer src="./app.js?v=19"></script>
</head>
<body>
<header class="topbar"><div class="brand"><span class="brand-mark" aria-hidden="true">P</span><div><h1>Prompt Palette <small>v19</small></h1><p>Portrait prompt studio</p></div></div><div class="header-actions"><div class="language" aria-label="出力言語"><button data-action="language" data-value="jp" aria-pressed="true">JP</button><button data-action="language" data-value="en" aria-pressed="false">EN</button></div><button class="icon-button" data-action="settings" aria-label="設定とバックアップ">⋯</button></div></header>
<div class="intro"><p>同じ人。新しい一瞬。</p><span>必要な差分だけを選んで、ひとつの写真集へ。</span></div>
<div id="storageNotice" class="notice" role="status" hidden></div>
<main id="app" aria-label="プロンプト設定"></main>
<footer class="dock"><div class="dock-inner"><div class="output-meta"><strong id="outputSummary"></strong><span id="outputCount"></span></div><div class="dock-actions"><button class="button quiet" data-action="take" title="選択を保ったままカットの候補を切り替えます">別カット</button><button class="button" data-action="preview">プレビュー</button><button class="button primary" data-action="copy">コピー</button></div></div></footer>
<dialog id="sheet" aria-labelledby="sheetTitle"><div class="sheet-head"><h2 id="sheetTitle"></h2><button class="icon-button" data-action="close" aria-label="閉じる">×</button></div><div id="sheetBody"></div></dialog>
<div id="toast" role="status" aria-live="polite"></div>
<noscript>Prompt Paletteを使うにはJavaScriptを有効にしてください。</noscript>
</body></html>
