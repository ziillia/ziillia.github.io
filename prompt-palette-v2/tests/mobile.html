<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Prompt Palette responsive check</title><style>body{margin:0;background:#080b10;color:#fff;font:14px system-ui}header{padding:15px;display:flex;gap:15px;align-items:center}select{font:inherit;padding:8px}iframe{display:block;width:390px;height:844px;border:1px solid #555;margin:0 auto;max-width:100%}p{margin:10px 15px;color:#b6c2d7}</style></head><body><header><label>表示幅 <select id="width"><option>320</option><option>375</option><option selected>390</option><option>430</option><option>768</option></select></label><a href="../" style="color:#b9ccff">アプリへ</a></header><p>CSSの狭幅確認用。iPhone実機のSafariを再現するものではありません。設定は通常のアプリと共有します。</p><iframe src="../" title="Prompt Palette narrow preview"></iframe><script>document.getElementById('width').addEventListener('change',e=>document.querySelector('iframe').style.width=e.target.value+'px');</script></body></html>
